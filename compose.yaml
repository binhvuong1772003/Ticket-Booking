x-backend: &backend
  build:
    context: .
  image: ticket-booking-backend:local
  init: true
  environment:
    NODE_ENV: development
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: auth
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d auth']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports:
      - '127.0.0.1:6380:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-topics.sh',
          '--bootstrap-server',
          'kafka:29092',
          '--list',
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        for topic in auth.user.registered ticket-type.created ticket-type.updated ticket-type.deleted session.status.changed session.rescheduled payment.succeeded payment.expired payment.failed payment.refunded booking.refund.requested event.cancelled event.published; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done
  api-gateway:
    <<: *backend
    env_file: ./apps/api-gateway/.env
    command: ['node', 'dist/apps/api-gateway/main.js']
    environment:
      NODE_ENV: development
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:4001/graphql
      AUTH_SERVICE_BASE_URL: http://auth-service:4001
      EVENT_SERVICE_URL: http://event-service:4003/graphql
      BOOKING_SERVICE_URL: http://booking-service:4002/graphql
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      auth-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3000/graphql",{method:"POST",headers:{"content-type":"application/json"},body:"{\"query\":\"{__typename}\"}"}).then(r=>r.json().then(j=>process.exit(r.ok&&!j.errors?0:1))).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  auth-service:
    <<: *backend
    env_file: ./apps/auth-service/.env
    command: ['node', 'dist/apps/auth-service/main.js']
    environment:
      NODE_ENV: development
      AUTH_PORT: 4001
      KAFKA_BROKER: kafka:29092
      # Uncomment to run auth against the local postgres container instead
      # of the Supabase DATABASE_URL from env_file (env var wins).
      # DATABASE_URL: postgresql://postgres:dev@postgres:5432/auth
    ports:
      - '127.0.0.1:4001:4001'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:4001/graphql",{method:"POST",headers:{"content-type":"application/json"},body:"{\"query\":\"{__typename}\"}"}).then(r=>r.json().then(j=>process.exit(r.ok&&!j.errors?0:1))).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  booking-service:
    <<: *backend
    env_file: ./apps/booking-service/.env
    command: ['node', 'dist/apps/booking-service/main.js']
    environment:
      NODE_ENV: development
      BOOKING_PORT: 4002
      INVENTORY_GRPC_URL: inventory-service:50051
      PAYMENT_GRPC_URL: payment-service:50052
      KAFKA_BROKERS: kafka:29092
    ports:
      - '127.0.0.1:4002:4002'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:4002/graphql",{method:"POST",headers:{"content-type":"application/json"},body:"{\"query\":\"{__typename}\"}"}).then(r=>r.json().then(j=>process.exit(r.ok&&!j.errors?0:1))).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  event-service:
    <<: *backend
    env_file: ./apps/event-service/.env
    command: ['node', 'dist/apps/event-service/main.js']
    environment:
      NODE_ENV: development
      EVENT_PORT: 4003
      KAFKA_BROKER: kafka:29092
    ports:
      - '127.0.0.1:4003:4003'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:4003/graphql",{method:"POST",headers:{"content-type":"application/json"},body:"{\"query\":\"{__typename}\"}"}).then(r=>r.json().then(j=>process.exit(r.ok&&!j.errors?0:1))).catch(()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  inventory-service:
    <<: *backend
    env_file: ./apps/inventory-service/.env
    command: ['node', 'dist/apps/inventory-service/main.js']
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:29092
    ports:
      - '127.0.0.1:50051:50051'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'const s=require("net").connect(50051,"127.0.0.1");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  payment-service:
    <<: *backend
    env_file: ./apps/payment-service/.env
    command: ['node', 'dist/apps/payment-service/main.js']
    environment:
      NODE_ENV: development
      PORT: 3010
      PAYMENT_GRPC_URL: 0.0.0.0:50052
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '127.0.0.1:3010:3010'
      - '127.0.0.1:50052:50052'
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'const s=require("net").connect(50052,"127.0.0.1");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
  notification-service:
    <<: *backend
    env_file: ./apps/notification-service/.env
    command: ['node', 'dist/apps/notification-service/src/main.js']
    environment:
      NODE_ENV: development
      KAFKA_BROKERS: kafka:29092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001/graphql
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
  kafka-data:
