syntax = "proto3";

package inventory;

service InventoryService {
  rpc Reserve (ReserveRequest) returns (ReserveResponse);
  rpc Release (ReleaseRequest) returns (ReleaseResponse);
  rpc Confirm (ConfirmRequest) returns (ConfirmResponse);
  rpc Revoke (RevokeRequest) returns (RevokeResponse);
}

message ReserveRequest {
  string session_id = 1;
  string ticket_type_id = 2;
  int32 quantity = 3;
  string booking_id = 4;
  string user_id = 5;
}

message ReserveResponse {
  bool success = 1;
  string reservation_id = 2;
  string message = 3;
  // Snapshot ticket type — giá theo đơn vị nhỏ nhất (smallest unit)
  string ticket_type_name = 4;
  string ticket_type_code = 5;
  int32 unit_price = 6;
  string currency = 7;
}

message ReleaseRequest {
  string reservation_id = 1;
  string booking_id = 2;
}

message ReleaseResponse {
  bool success = 1;
  string message = 2;
}

message ConfirmRequest {
  string reservation_id = 1;
  string booking_id = 2;
}

message ConfirmResponse {
  bool success = 1;
  string message = 2;
}

// Revoke = trả vé ĐÃ BÁN (hold CONFIRMED) về kho sau khi refund xong.
// Khác Release: Release chỉ đụng hold ACTIVE (chưa thanh toán).
message RevokeRequest {
  string reservation_id = 1;
  string booking_id = 2;
}

message RevokeResponse {
  bool success = 1;
  string message = 2;
}