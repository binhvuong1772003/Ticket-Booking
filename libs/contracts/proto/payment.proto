syntax = "proto3";

package payment;

service PaymentService {
  rpc CreateCheckout (CreateCheckoutRequest) returns (CreateCheckoutResponse);
  rpc Refund (RefundRequest) returns (RefundResponse);
}

message CreateCheckoutRequest {
  string booking_id = 1;
  int32 amount = 2;
  string currency = 3;
  string organizer_account_id = 4;
  int32 quantity = 5;
  string ticket_type_name = 6;
  string success_url = 7;
  // userId của người mua — Payment giữ lại để event refund mang theo,
  // notification-service resolve userId → email qua auth-service.
  string user_id = 8;
}

message CreateCheckoutResponse {
  bool success = 1;
  string checkout_session_id = 2;
  string client_secret = 3;
  string message = 4;
}

message RefundRequest {
  string booking_id = 1;
  string reason = 2;
}

message RefundResponse {
  // Refund là async: intent được ghi durable trước, Stripe chạy sau qua queue.
  // accepted = intent đã ghi (an toàn để caller cancel booking ngay).
  bool accepted = 1;
  string refund_id = 2;
  string message = 3;
  // refunded = payment đã REFUNDED (retry trên payment đã xong) — caller có
  // thể markRefunded ngay mà không chờ event payment.refunded.
  bool refunded = 4;
}
