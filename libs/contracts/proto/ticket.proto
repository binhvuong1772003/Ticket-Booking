syntax = "proto3";

package ticket;

service TicketService {
  rpc ListOwnedTickets (ListOwnedTicketsRequest) returns (ListOwnedTicketsResponse);
  rpc GetOwnedTicket (OwnedTicketRequest) returns (TicketResponse);
  rpc GetTicketForDelivery (TicketRequest) returns (TicketResponse);
  rpc RenderTicketForDelivery (TicketRequest) returns (TicketImageResponse);
  rpc CheckInTicket (CheckInTicketRequest) returns (CheckInTicketResponse);
}

message ListOwnedTicketsRequest {
  string owner_id = 1;
  string cursor = 2;
  int32 limit = 3;
}
message ListOwnedTicketsResponse {
  repeated TicketSummary items = 1;
  string next_cursor = 2;
}
message OwnedTicketRequest {
  string owner_id = 1;
  string ticket_id = 2;
}
message TicketRequest { string ticket_id = 1; }
message TicketResponse { TicketDetail ticket = 1; }
message TicketImageResponse { bytes png = 1; }

message TicketSummary {
  string ticket_id = 1;
  string booking_id = 2;
  int32 ordinal = 3;
  string status = 4;
  string issued_at = 5;
  string event_title = 6;
  string starts_at = 7;
  string ends_at = 8;
  string timezone = 9;
  string ticket_type_name = 10;
  string ticket_type_code = 11;
}
message TicketDetail {
  TicketSummary summary = 1;
  string cover_image_url = 2;
  string venue_name = 3;
  string venue_address = 4;
  string unit_price = 5;
  string currency = 6;
  int32 template_version = 7;
  int32 render_revision = 8;
  string qr_token = 9;
  string poster_image_url = 10;
}
message CheckInTicketRequest {
  string scanner_id = 1;
  string session_id = 2;
  string qr_token = 3;
  string request_id = 4;
  string gate_id = 5;
}
message CheckInTicketResponse { string result = 1; string ticket_id = 2; }
