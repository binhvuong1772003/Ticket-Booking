type CategoryModel {
  id: ID!
  name: String!
  slug: String!
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type TicketType {
  id: ID!
  sessionId: ID!
  name: String!
  code: String!
  price: Int!
  quantity: Int!
  sold: Int!

  """Live best-effort quantity from inventory; booking rechecks atomically."""
  availableQuantity: Int

  """Null when this ticket type has no per-booking limit."""
  maxPerBooking: Int
  salesStartAt: DateTime
  status: TicketTypeStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum TicketTypeStatus {
  ACTIVE
  INACTIVE
  SOLD_OUT
}

type EventSession {
  id: ID!
  eventId: ID!
  name: String
  venueName: String
  venueAddress: String
  city: String
  countryCode: String
  placeId: ID
  startsAt: DateTime
  endsAt: DateTime
  timezone: String!
  capacity: Int
  currency: String!
  status: EventSessionStatus!
  version: Int!
  cancelledAt: DateTime
  cancellationReason: String
  createdAt: DateTime!
  updatedAt: DateTime!
  ticketTypes: [TicketType!]
}

enum EventSessionStatus {
  DRAFT
  SCHEDULED
  CANCELLED
  COMPLETED
}

type EventModel {
  id: ID!
  title: String!
  slug: String!
  categoryId: ID
  summary: String
  description: String
  organizerDisplayName: String
  contactEmail: String
  contactPhone: String
  coverImageUrl: String
  posterImageUrl: String
  status: String!
  publishedAt: DateTime
  cancelledAt: DateTime
  cancellationReason: String
  archivedAt: DateTime
  featuredOrder: Int
  createdAt: DateTime!
  updatedAt: DateTime!
  sessions: [EventSession!]
  nextSession: EventSession
  priceFrom: Int
  currency: String
  availability: EventAvailability
}

enum EventAvailability {
  AVAILABLE
  SOLD_OUT
  NOT_ON_SALE
  ENDED
  CANCELLED
}

type TicketEventSnapshot {
  eventTitle: String!
  eventStatus: String!
  coverImageUrl: String
  posterImageUrl: String
  venueName: String
  venueAddress: String
  startsAt: DateTime
  endsAt: DateTime
  timezone: String!
  sessionVersion: Int!
  sessionStatus: String!
}

type SupportedCurrency {
  code: String!
  name: String!
  minorUnit: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type EventConnection {
  nodes: [EventModel!]!
  pageInfo: PageInfo!
}

type EventSessionConnection {
  nodes: [EventSession!]!
  pageInfo: PageInfo!
}

type TrendingEventModel {
  rank: Int!
  event: EventModel!
}

type CountryOption {
  code: String!
  nameVi: String!
  nameEn: String!
}

type PlaceOption {
  id: ID!
  type: PlaceType!
  code: String!
  name: String!
  countryCode: String!
  aliases: [String!]!
}

enum PlaceType {
  CITY
  STATE
}

type Query {
  events: [EventModel!]!
  eventsPage(first: Int! = 20, after: String, filter: EventsFilterInput): EventConnection!
  featuredEvents(city: String, first: Int! = 10): [EventModel!]!
  trendingEvents(city: String, first: Int! = 10): [TrendingEventModel!]!
  eventSessions(eventId: ID!, first: Int! = 20, after: String, filter: EventSessionsFilterInput): EventSessionConnection!
  supportedCurrencies: [SupportedCurrency!]!
  myEvents: [EventModel!]!
  event(id: ID!): EventModel!
  ticketSnapshot(eventId: ID!, sessionId: ID!): TicketEventSnapshot!
  adminCategories: [CategoryModel!]!
  adminCategory(id: ID!): CategoryModel!
  publicCategories: [CategoryModel!]!
  countries: [CountryOption!]!
  places(countryCode: String!): [PlaceOption!]!
}

input EventsFilterInput {
  categoryId: ID
  q: String
  city: String
  countryCode: String
  placeId: ID
  startsAtFrom: DateTime
  startsAtTo: DateTime
  upcomingOnly: Boolean! = false
}

input EventSessionsFilterInput {
  city: String
  countryCode: String
  placeId: ID
  startsAtFrom: DateTime
  startsAtTo: DateTime
  status: EventSessionStatus
}

type Mutation {
  setEventFeatured(eventId: ID!, featuredOrder: Int): EventModel!
  createEvent(input: CreateEventInput!): EventModel!
  updateEvent(input: UpdateEventInput!): EventModel!
  updateEventStatus(input: UpdateEventStatusInput!): EventModel!
  createEventSession(input: CreateEventSessionInput!): EventSession!
  updateEventSession(input: UpdateEventSessionInput!): EventSession!
  updateEventSessionStatus(input: UpdateEventSessionStatusInput!): EventSession!
  rescheduleSession(input: RescheduleSessionInput!): EventSession!
  createTicketType(input: CreateTicketTypeInput!): TicketType!
  updateTicketType(input: UpdateTicketTypeInput!): TicketType!
  updateTicketTypeStatus(input: UpdateTicketTypeStatusInput!): TicketType!
  deleteTicketType(id: ID!): TicketType!
  refundTicket(eventId: ID!, bookingId: ID!, reason: String): Boolean!
  createCategory(input: CreateCategoryInput!): CategoryModel!
  updateCategory(input: UpdateCategoryInput!): CategoryModel!
  deleteCategory(id: ID!): Boolean!
}

input CreateEventInput {
  categoryId: ID
  title: String!
  slug: String!
  summary: String
  organizerDisplayName: String
  contactEmail: String
  contactPhone: String
  coverImageUrl: String
  posterImageUrl: String
}

input UpdateEventInput {
  id: String!
  categoryId: ID
  title: String
  slug: String
  summary: String
  organizerDisplayName: String
  contactEmail: String
  contactPhone: String
  coverImageUrl: String
  posterImageUrl: String
}

input UpdateEventStatusInput {
  id: ID!
  status: EventStatus!
  cancellationReason: String
}

enum EventStatus {
  DRAFT
  PUBLISHED
  CANCELLED
  ARCHIVED
}

input CreateEventSessionInput {
  eventId: ID!
  name: String
  venueName: String
  venueAddress: String
  city: String
  countryCode: String
  placeId: ID
  startsAt: DateTime
  endsAt: DateTime
  timezone: String
  capacity: Float
  currency: String
}

input UpdateEventSessionInput {
  id: ID!
  name: String
  venueName: String
  venueAddress: String
  city: String
  countryCode: String
  placeId: ID
  startsAt: DateTime
  endsAt: DateTime
  timezone: String
  capacity: Float
  currency: String
}

input UpdateEventSessionStatusInput {
  id: ID!
  status: EventSessionStatus!
  cancellationReason: String
}

input RescheduleSessionInput {
  id: ID!
  startsAt: DateTime
  endsAt: DateTime
  timezone: String
  venueName: String
  venueAddress: String
  city: String
  countryCode: String
  placeId: ID
}

input CreateTicketTypeInput {
  sessionId: ID!
  name: String!
  code: String!
  price: Int!
  quantity: Int!

  """
  Opening time: ISO 8601 timestamp with Z or an explicit timezone offset.
  """
  salesStartAt: String
}

input UpdateTicketTypeInput {
  """
  Opening time: ISO 8601 timestamp with Z or an explicit timezone offset.
  """
  salesStartAt: String
  id: ID!
  name: String
  code: String
  price: Int
  quantity: Int
}

input UpdateTicketTypeStatusInput {
  id: ID!
  status: TicketTypeStatus!
}

input CreateCategoryInput {
  name: String!
  slug: String!
  isActive: Boolean
}

input UpdateCategoryInput {
  id: ID!
  name: String
  slug: String
  isActive: Boolean
}
