    <text x="56" y="152" fill="#f8fafc" font-size="66" font-weight="700" letter-spacing="-2">Ticket Booking</text>
    <text x="59" y="199" fill="#cbd5e1" font-size="23">From the first reservation to the final confirmation.</text>
    <text x="59" y="252" fill="#7dd3fc" font-size="17" font-weight="600">7 SERVICES</text>
    <circle cx="190" cy="246" r="3" fill="#475569"/>
