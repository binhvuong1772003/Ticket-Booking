    </g>
    <g fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">
      <text x="106" y="307">NestJS</text><text x="222" y="307">GraphQL</text>
      <text x="332" y="307">gRPC</text><text x="431" y="307">Kafka</text>
    </g>
    <text x="58" y="383" fill="#94a3b8" font-size="16" letter-spacing="1">TYPESCRIPT / POSTGRESQL / MONGODB / REDIS / STRIPE / DOCKER</text>
