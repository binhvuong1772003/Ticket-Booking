<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Ticket Booking — Personal Backend Project</title>
  <desc id="desc">A navy project cover with a ticket illustration, seven connected service nodes, and technology labels for NestJS, GraphQL, gRPC, Kafka, PostgreSQL, MongoDB, Redis, and Stripe.</desc>
  <rect width="1280" height="420" rx="24" fill="#0f172a"/>
